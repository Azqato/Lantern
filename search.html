<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lantern — Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lantern: {
              50:'#fafaf8', 100:'#f5f5f1', 200:'#ebe7e1', 300:'#ddd7ce',
              400:'#cfc9ba', 500:'#c1bda6', 600:'#8b8772', 700:'#6b6652',
              800:'#4a4639', 900:'#2a2622',
            }
          },
          fontFamily: {
            serif: ['Georgia','Garamond','serif'],
            sans:  ['system-ui','-apple-system','sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .serif { font-family: Georgia, Garamond, serif; }
    #search-input:focus { outline: none; }
    .cat-btn.active { background:#6b6652; color:white; border-color:#6b6652; }
    .cat-btn:not(.active):hover { border-color:#8b8772; color:#2a2622; }
  </style>
</head>
<body class="bg-lantern-50 text-lantern-900 antialiased">

  <div id="nav-root"></div>
  <script src="nav.js"></script>

  <main class="max-w-4xl mx-auto px-6 py-10">

    <!-- Header + Search -->
    <div class="mb-8">
      <h1 class="serif text-4xl font-bold text-lantern-900 mb-6">Search</h1>

      <div class="relative">
        <!-- Magnifying glass icon -->
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 text-lantern-400 pointer-events-none"
             width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Search titles, creators, themes, users&hellip;"
          class="w-full pl-12 pr-4 py-3.5 bg-white border border-lantern-200 rounded-lg text-lantern-900 placeholder-lantern-400 text-sm transition-colors"
          style="box-shadow:none"
          onfocus="this.style.borderColor='#6b6652';this.style.boxShadow='0 0 0 1px #6b6652'"
          onblur="this.style.borderColor='#ebe7e1';this.style.boxShadow='none'"
        />
      </div>
    </div>

    <!-- Category filters -->
    <div class="flex flex-wrap gap-2 mb-10" id="cat-filters"></div>

    <!-- Default state: trending + suggested -->
    <div id="default-state">

      <!-- Trending -->
      <section class="mb-10">
        <h2 class="text-xs font-semibold uppercase tracking-widest text-lantern-500 mb-4">
          Trending in your network
        </h2>
        <div id="trending-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
      </section>

      <!-- Suggested -->
      <section>
        <h2 class="text-xs font-semibold uppercase tracking-widest text-lantern-500 mb-4">
          Try asking
        </h2>
        <div id="suggested-list" class="flex flex-wrap gap-2"></div>
      </section>
    </div>

    <!-- Results state (shown when typing) -->
    <div id="results-state" class="hidden">
      <div class="bg-white border border-lantern-200 rounded-lg p-10 text-center">
        <p id="results-query" class="serif text-lantern-500 mb-1"></p>
        <p class="text-xs text-lantern-400">
          Search results will appear here once connected to the media database.
        </p>
      </div>
    </div>

  </main>

  <script>
    const CATEGORIES = ['All','Books','Movies','TV','Music','Games','Podcasts'];

    const TRENDING = [
      { query:'Haruki Murakami',   category:'Books' },
      { query:'Wong Kar-wai',      category:'Movies' },
      { query:'Sufjan Stevens',    category:'Music' },
      { query:'Disco Elysium',     category:'Games' },
      { query:'Severance',         category:'TV' },
      { query:'Edward Yang',       category:'Movies' },
    ];

    const SUGGESTED = [
      'Films that feel like autumn',
      'Books about grief',
      'Albums under 40 minutes',
      'Games with literary writing',
      'Podcasts about history',
    ];

    let activeCategory = 'All';

    // ── Category filters ─────────────────────────────────────────
    document.getElementById('cat-filters').innerHTML = CATEGORIES.map(cat => `
      <button
        class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium border transition-colors ${cat === 'All' ? 'active' : 'bg-white border-lantern-200 text-lantern-600'}"
        onclick="setCategory('${cat}', this)"
      >${cat}</button>
    `).join('');

    function setCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = cat;
    }

    // ── Trending ──────────────────────────────────────────────────
    document.getElementById('trending-grid').innerHTML = TRENDING.map(item => `
      <button
        class="flex items-center justify-between bg-white border border-lantern-200 rounded-lg px-4 py-3 text-left hover:shadow-sm transition-all group"
        onclick="fillSearch('${item.query}')"
        style="border-color:#ebe7e1"
        onmouseover="this.style.borderColor='#ddd7ce'"
        onmouseout="this.style.borderColor='#ebe7e1'"
      >
        <span class="serif font-semibold text-sm text-lantern-900">${item.query}</span>
        <span class="text-xs bg-lantern-100 text-lantern-500 px-2 py-0.5 rounded">${item.category}</span>
      </button>
    `).join('');

    // ── Suggested ─────────────────────────────────────────────────
    document.getElementById('suggested-list').innerHTML = SUGGESTED.map(s => `
      <button
        class="text-sm text-lantern-600 border border-lantern-200 bg-white px-3 py-1.5 rounded-full italic transition-colors"
        onclick="fillSearch('${s}')"
        onmouseover="this.style.borderColor='#cfc9ba';this.style.color='#2a2622'"
        onmouseout="this.style.borderColor='#ebe7e1';this.style.color='#8b8772'"
      >${s}</button>
    `).join('');

    // ── Search input handler ──────────────────────────────────────
    const input = document.getElementById('search-input');
    const defaultEl = document.getElementById('default-state');
    const resultsEl = document.getElementById('results-state');
    const queryLabel = document.getElementById('results-query');

    input.addEventListener('input', function() {
      const q = this.value.trim();
      if (q === '') {
        defaultEl.classList.remove('hidden');
        resultsEl.classList.add('hidden');
      } else {
        defaultEl.classList.add('hidden');
        resultsEl.classList.remove('hidden');
        queryLabel.textContent = `Searching for "${q}"`;
      }
    });

    function fillSearch(query) {
      input.value = query;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }
  </script>
</body>
</html>
